name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runspoke-linux-x86_64
          path: dist
      - name: Publish the checked archive for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check --strict "runspoke-${RELEASE_TAG#v}-linux-x86_64.tar.gz.sha256"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "runspoke-${RELEASE_TAG#v}-linux-x86_64.tar.gz" \
            "runspoke-${RELEASE_TAG#v}-linux-x86_64.tar.gz.sha256" \
            --verify-tag --generate-notes --title "Runspoke $RELEASE_TAG" "${release_flags[@]}"
