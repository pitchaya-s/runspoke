[package]
name = "runspk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A distributed job queue for trusted Linux machines."
readme = "../../README.md"
repository = "https://github.com/pitchaya-s/runspoke"
keywords = ["distributed", "job-queue", "scheduler", "linux"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
http-body = "1"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
